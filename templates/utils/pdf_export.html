<!DOCTYPE html>
<html>
<head>
    <style>
        @page {
            size: a4 landscape;
            margin: 1cm;
        }
        body {
            font-family: Helvetica, Arial, sans-serif;
            font-size: 10pt;
            color: #333;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }
        .title {
            font-size: 18pt;
            font-weight: bold;
            text-transform: uppercase;
        }
        .meta {
            font-size: 9pt;
            color: #666;
            margin-top: 5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            table-layout: fixed;
        }
        th {
            background-color: #f2f2f2;
            text-align: left;
            padding: 4px;
            border: 1px solid #ccc;
            font-weight: bold;
            font-size: 8.5pt;
            word-wrap: break-word;
            -pdf-keep-with-next: true;
        }
        td {
            padding: 4px;
            border: 1px solid #ccc;
            font-size: 7.5pt;
            vertical-align: top;
        }
        .cell-wrap {
            word-wrap: break-word;
            word-break: break-all;
            overflow-wrap: break-word;
        }
        .footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            text-align: center;
            font-size: 8pt;
            color: #999;
            border-top: 1px solid #eee;
            padding-top: 5px;
        }
        thead {
            display: table-header-group;
        }
        tr {
            page-break-inside: avoid;
        }
        /* Ensure thead is repeated on every page */
        table {
            -pdf-keep-with-next: true;
        }
    </style>
</head>
<body>
    <table style="width: 100%; border: none; margin-bottom: 20px; border-bottom: 3px solid #000; padding-bottom: 10px;">
        <tr>
            <td width="60" style="border: none; vertical-align: middle;">
                <img src="d:\MAIN\PROJECTS\FootFront\static\favicon.png" style="height: 75px; width: 75px;" alt="Logo">
            </td>
            <td style="border: none; vertical-align: middle; padding-left: 5px;">
                <div style="font-size: 22pt; font-weight: bold; text-transform: uppercase; line-height: 1;">
                    FootFront - {{ title }}
                </div>
            </td>
            <td align="right" style="border: none; vertical-align: middle;">
                <div class="meta" style="font-weight: bold; color: #000;">Generated on: {{ timestamp }}</div>
            </td>
        </tr>
    </table>

    <table repeat="1" style="width: 100%;">
        <thead>
            <tr>
                {% for header in headers %}
                <th style="background-color: #f2f2f2; border: 1px solid #ccc; padding: 6px; font-weight: bold; font-size: 9pt;">{{ header }}</th>
                {% endfor %}
            </tr>
        </thead>
        <tbody>
            {% for row in data %}
            <tr>
                {% for cell in row %}
                <td><div class="cell-wrap">{{ cell|default:"-"|safe }}</div></td>
                {% endfor %}
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <div class="footer">
        &copy; {{ current_year }} FootFront Multi-Vendor Platform. Page <pdf:pagenumber> of <pdf:pagecount>
    </div>
</body>
</html>
