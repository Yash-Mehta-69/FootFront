{% extends 'dashboard/admin_base.html' %}

{% block title %}Orders | Admin Panel{% endblock %}

{% block header_title %}Orders{% endblock %}
{% block breadcrumb %}
<span class="breadcrumb-separator"><i class="fas fa-chevron-right"></i></span>
<span class="breadcrumb-current">Orders</span>
{% endblock %}s

{% block admin_content %}
<div class="custom-card">
    <div class="card-header-custom d-flex justify-content-between align-items-center flex-wrap gap-3">
        <h5 class="card-title-custom mb-0">Order Management</h5>
        <div class="d-flex align-items-center gap-2">
            <form method="get" class="d-flex gap-2" onsubmit="return false;">
                <input type="text" name="q" value="{{ search_query|default:'' }}" class="form-control-custom" placeholder="Order ID or Customer..." style="width: 250px;">
                
                <select name="vendor" class="form-select-custom" style="width: 180px;">
                    <option value="">All Vendors</option>
                    {% for v in vendors %}
                    <option value="{{ v.pk }}" {% if current_vendor == v.pk %}selected{% endif %}>{{ v.shopName }}</option>
                    {% endfor %}
                </select>

                <select name="sort" class="form-select-custom" style="width: 160px;">
                    <option value="date_newest" {% if current_sort == 'date_newest' %}selected{% endif %}>Newest First</option>
                    <option value="date_oldest" {% if current_sort == 'date_oldest' %}selected{% endif %}>Oldest First</option>
                </select>
            </form>
            <button onclick="exportData()" class="btn-secondary-custom">
                <i class="fas fa-file-export"></i> Export CSV
            </button>
        </div>
    </div>
    <div class="table-responsive">
        {% include 'dashboard/partials/order_table.html' %}
    </div>
</div>

<script>
    function toggleTracking(id) {
        var status = document.getElementById('select-status-' + id).value;
        var trackingInput = document.getElementById('tracking-input-' + id);
        var courierField = document.getElementById('courier-' + id);
        var trackingField = document.getElementById('tracking-' + id);
        
        if (status === 'preparing' || status === 'delivered') {
            trackingInput.style.display = 'none';
            courierField.required = false;
            trackingField.required = false;
        } else {
            trackingInput.style.display = 'block';
            courierField.required = true;
            trackingField.required = true;
        }
    }
</script>
{% endblock %}
