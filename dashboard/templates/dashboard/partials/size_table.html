<table class="table-custom">
    <thead>
        <tr>
            <th>Size Label</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for size in sizes %}
        <tr>
            <td class="fw-bold">{{ size.size_label }}</td>
            <td>
                <a href="{% url 'delete_size' size.pk %}" class="btn-icon-soft text-danger" title="Delete" onclick="return confirm('Are you sure you want to delete this size?');">
                    <i class="fas fa-trash"></i>
                </a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="2" class="text-center py-4 text-muted">No sizes found.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
