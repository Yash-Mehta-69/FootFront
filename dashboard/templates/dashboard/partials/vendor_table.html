<table class="table-custom">
    <thead>
        <tr>
            <th>Shop Name</th>
            <th>Owner</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for vendor in vendors %}
        <tr>
            <td><strong>{{ vendor.shopName }}</strong></td>
            <td>{{ vendor.user.get_full_name }}</td>
            <td>{{ vendor.user.email }}</td>
            <td>{{ vendor.business_phone }}</td>
            <td>
                {% if vendor.is_blocked %}
                    <span class="status-badge status-inactive"><i class="fas fa-ban"></i> Blocked</span>
                {% else %}
                    <span class="status-badge status-active"><i class="fas fa-check-circle"></i> Active</span>
                {% endif %}
            </td>
            <td>
                <a href="{% url 'detail_vendor' vendor.pk %}" class="btn-icon-soft"><i class="fas fa-eye"></i></a>
                <a href="{% url 'edit_vendor' vendor.pk %}" class="btn-icon-soft"><i class="fas fa-edit"></i></a>
                <a href="{% url 'delete_vendor' vendor.pk %}" class="btn-icon-soft text-danger"><i class="fas fa-trash"></i></a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="6">
                <div class="empty-state">
                    <div class="empty-state-icon"><i class="fas fa-store-slash"></i></div>
                    <h3 class="empty-state-title">No Vendors Found</h3>
                </div>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
