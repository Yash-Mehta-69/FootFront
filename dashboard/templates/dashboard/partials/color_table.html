<table class="table-custom">
    <thead>
        <tr>
            <th>Color Name</th>
            <th>Code</th>
            <th>Preview</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for color in colors %}
        <tr>
            <td class="fw-bold">{{ color.name }}</td>
            <td>{{ color.hex_code }}</td>
            <td>
                <div class="rounded border" style="width: 30px; height: 30px; background-color: {{ color.hex_code }};"></div>
            </td>
            <td>
                <a href="{% url 'delete_color' color.pk %}" class="btn-icon-soft text-danger" title="Delete" onclick="return confirm('Are you sure you want to delete this color?');">
                    <i class="fas fa-trash"></i>
                </a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4" class="text-center py-4 text-muted">No colors found.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
