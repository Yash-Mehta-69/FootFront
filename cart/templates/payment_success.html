{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container" style="padding-top: 200px; text-align: center; min-height: 80vh;">
    <div style="background: var(--glass-bg); padding: 4rem; border-radius: 12px; border: 1px solid var(--color-accent);">
        <i class="fas fa-check-circle" style="font-size: 5rem; color: var(--color-accent); margin-bottom: 2rem;"></i>
        <h1 class="glitch-text" style="font-size: 3rem;">PAYMENT SUCCESSFUL</h1>
        <p class="mt-4" style="font-family: monospace;">Transaction ID: {{ payment_id }}</p>
        <p class="text-muted-theme">Your order has been placed and is being processed.</p>
        
        <div class="mt-5">
            <a href="{% url 'shop' %}" class="btn-primary">CONTINUE SHOPPING</a>
        </div>
    </div>
</div>
{% endblock %}
